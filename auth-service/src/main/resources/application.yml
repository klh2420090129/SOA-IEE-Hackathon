server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: soa-team8-default-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256!
  issuer: soa-team8-auth-service
  audience: soa-team8-platform
  expiration-seconds: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
