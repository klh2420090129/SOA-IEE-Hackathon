server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: cargo-declaration-service-route
          uri: lb://cargo-declaration-service
          predicates:
            - Path=/api/v1/declarations/**
        - id: compatibility-rule-service-route
          uri: lb://compatibility-rule-service
          predicates:
            - Path=/api/v1/rules/**, /api/v1/rule-snapshots/**
        - id: compartment-service-route
          uri: lb://compartment-service
          predicates:
            - Path=/api/v1/assessments/**, /api/v1/layouts/**
        - id: optimization-service-route
          uri: lb://optimization-service
          predicates:
            - Path=/api/v1/optimization-jobs/**
        - id: validation-service-route
          uri: lb://validation-service
          predicates:
            - Path=/api/v1/validations/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
